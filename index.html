<style>
:root{
  --ink:#0a0a0a;
  --green:#c9ff3f;
  --white:#ffffff;
}
*{
  box-sizing:border-box;
}
html,body{
  margin:0;
  min-height:100%;
  background:var(--white);
  color:var(--ink);
  font-family:"Quicksand",sans-serif;
}
body{
  min-height:100vh;
}
.page{
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  padding:30px clamp(24px,5vw,72px) 78px;
}
.identity{
  position:absolute;
  top:30px;
  left:clamp(24px,5vw,72px);
  margin:0;
  font-size:15px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.02em;
}
.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  width:min(1300px,100%);
  padding-top:55px;
}
h1{
  margin:0;
  max-width:1300px;
  font-size:clamp(58px,8.6vw,120px);
  line-height:.89;
  letter-spacing:-.04em;
  font-weight:900;
  color:var(--ink);
}
.cta-wrap{
  margin-top:clamp(34px,4vw,70px);
  position:relative;
}
.cta{
  --lift:0px;
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:68px;
  padding:0 28px;
  background:var(--green);
  color:var(--ink);
  border:2.5px solid var(--ink);
  font-size:16px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.025em;
  text-decoration:none;
  box-shadow:7px -6px 0 var(--ink);
  transform:translateY(var(--lift));
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-radius .22s ease;
}
.cta::before,.cta::after{
  content:"";
  position:absolute;
  top:-17px;
  width:45px;
  height:25px;
  background:var(--green);
  border:2.5px solid var(--ink);
  box-shadow: 9px -7px 0 var(--ink);
  border-bottom:0;
  opacity:0;
  transform:translateY(-8px) scaleY(.35);
  transform-origin:bottom;
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1);
}
.cta::before{
  left:15%;
}
.cta::after{
  right:15%;
}
.cta:hover,.cta:focus-visible{
  --lift:-5px;
  border-radius:2px;
  box-shadow: 9px -7px 0 var(--ink);
}
.cta:hover::before,.cta:hover::after,.cta:focus-visible::before,.cta:focus-visible::after{
  opacity:1;
  transform:translateY(-10px) scaleY(1);
}
.cta:active{
  --lift:2px;
  box-shadow:3px 3px 0 var(--ink);
}
.cta:focus-visible{
  outline:4px solid rgba(201,255,63,.5);
  outline-offset:6px;
}
.cta-wrap .note {
  font-size: 11px;
  max-width:400px;
  font-weight:300;
  padding:0 10px 10px;
}
.bottom-strip{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  min-height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ink);
  color:var(--white);
  z-index:20;
  padding:10px 20px;
}
.bottom-list{
  margin:0;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  list-style:none;
  font-size:12px;
  font-weight:800;
  letter-spacing:.045em;
  text-transform:uppercase;
  text-align:center;
}
.bottom-list li{
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}
.bottom-list li::before{
  content:"•";
  color:var(--white);
  margin-right:9px;
  font-size:15px;
  line-height:1;
}
@media(max-width:700px){
  .page{
    padding-top:24px;
    padding-bottom:64px;
  }
  .identity{
    top:24px;
  }
  .hero{
    padding-top:48px;
  }
  h1{
    font-size:clamp(52px,10vw,82px);
    line-height:.92;
  }
  .cta{
    min-height:62px;
    padding:0 22px;
    font-size:15px;
  }
  .bottom-strip{
    min-height:34px;
    padding:8px 14px;
  }
  .bottom-list{
    gap:16px;
    font-size:10px;
    letter-spacing:.03em;
  }
  .bottom-list li::before{
    margin-right:6px;
    font-size:12px;
  }
}
@media(max-width:430px){
  h1{
    font-size:clamp(48px,12.6vw,68px);
  }
  .cta{
    width:auto;
    max-width:100%;
  }
  .bottom-strip{
    min-height:32px;
    padding:7px 10px;
  }
  .bottom-list{
    gap:10px;
    font-size:9px;
  }
  .bottom-list li::before{
    margin-right:4px;
    font-size:10px;
  }
}
@media(prefers-reduced-motion:reduce){
  .cta,.cta::before,.cta::after{
    transition:none;
  }
}
</style>
